<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyImGen Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud { position: fixed; left: 16px; top: 16px; display: flex; flex-direction: column; gap: 10px; max-width: min(360px, calc(100vw - 32px)); }
  .panel { background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); backdrop-filter: blur(6px); }
  .panel h1 { font-size: 15px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .panel a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px; }
  select { width: 100%; font: inherit; font-size: 13.5px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); }
  .keys { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  kbd { font-family: "JetBrains Mono", monospace; font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface-2); color: var(--text); }
  .bars { display: grid; grid-template-columns: 92px 1fr 36px; gap: 3px 8px; font-size: 12px; align-items: center; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .rates { display: grid; grid-template-columns: 78px 1fr 92px; gap: 4px 8px; font-size: 12.5px; align-items: center; }
  .rates input { width: 100%; accent-color: var(--accent); }
  .btn2 { border: 1px solid var(--line); background: var(--surface-2); color: var(--text); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn2:disabled { opacity: .5; cursor: default; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; text-align: center; padding: 16px; }
  .hud { max-height: calc(100vh - 32px); overflow-y: auto; }
  @media (max-width: 640px) { .hud .keys, .hud .bars, #ratepanel { display: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<div class="msg" id="msg">Loading…</div>
<div class="hud">
  <div class="panel">
    <h1><span class="logo" style="width:22px;height:22px;font-size:12px;border-radius:6px">t</span>Play <a href="/3d" style="margin-left:auto">← 3D Humans</a></h1>
    <select id="pick" aria-label="Character"></select>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><span class="keys" style="white-space:nowrap">Hold</span><select id="prop" aria-label="Held prop"><option value="">nothing</option></select></div>
  </div>
  <div class="panel keys">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Shift</kbd> run · drag to orbit · scroll to zoom<br>
    <kbd>T</kbd> controls: <b id="mode">strafe</b> <span id="modehint">(faces the camera — S walks back, A/D strafe)</span>
  </div>
  <div class="panel" id="ratepanel">
    <h1 style="font-size:13.5px">Clip speeds <span class="keys" style="margin-left:auto;font-weight:400">tempo × captured</span></h1>
    <div class="rates" id="rates"></div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <button class="btn2" id="saverates" type="button">Save + re-rig</button>
      <button class="btn2" id="resetrates" type="button">Reset</button>
      <span class="keys" id="ratemsg"></span>
    </div>
  </div>
  <div class="panel">
    <div class="bars mono" id="bars"></div>
    <div class="keys mono" id="speed" style="margin-top:6px"></div>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { Locomotion } from "/static/locomotion.js";
import { attachProp, readyPose, solveSupportHand, detachProp, setFingers, carryPose } from "/static/props.js";

const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
$("#stage").append(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 200);

// 1 m floor tiles (a canvas texture) so speed and foot planting read against the ground
const tile = document.createElement("canvas"); tile.width = tile.height = 256;
const floorTex = new THREE.CanvasTexture(tile);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(200, 200);
floorTex.colorSpace = THREE.SRGBColorSpace; floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
function themeColors() {
  const bg = new THREE.Color(css("--bg") || "#f6f5f2");
  scene.background = bg; scene.fog = new THREE.Fog(bg, 18, 60);
  const g = tile.getContext("2d");
  g.fillStyle = css("--surface-2") || "#efede8"; g.fillRect(0, 0, 256, 256);
  g.fillStyle = css("--surface") || "#ffffff"; g.fillRect(0, 0, 128, 128); g.fillRect(128, 128, 128, 128);
  g.strokeStyle = css("--line") || "#dedad2"; g.lineWidth = 4; g.strokeRect(0, 0, 256, 256);
  floorTex.needsUpdate = true;
}
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 30 });
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ roughness: 1, map: floorTex }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// a few posts so movement reads against the world
const postMat = new THREE.MeshStandardMaterial({ color: 0xb9b2a5, roughness: 0.9 });
for (let i = 0; i < 40; i++) {   // (repeat 200 over 400 m: each texture tile is 2 m, four 1 m squares)
  const r = 4 + (i * 7.3) % 30, a = i * 2.39;
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6 + (i % 5) * 0.5, 0.4), postMat);
  m.position.set(Math.cos(a) * r, m.geometry.parameters.height / 2, Math.sin(a) * r);
  m.castShadow = m.receiveShadow = true; scene.add(m);
}
themeColors();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", themeColors);

// character
let char = null, loco = null, height = 1.8;
const yaw = { body: 0, cam: 0 }, cam = { pitch: 0.28, dist: 4.2 };
async function load(id, fresh = false) {
  $("#msg").hidden = false; $("#msg").textContent = "Loading…";
  if (char) { scene.remove(char); char = null; loco = null; }
  const j = await (await fetch("/api/3d/" + id)).json();
  const gltf = await new GLTFLoader().loadAsync(`/media/3d/${id}/${j.outputs.rigged}?v=${fresh ? Date.now() : j.elapsed || 0}`);
  char = gltf.scene;
  char.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  height = new THREE.Box3().setFromObject(char).getSize(new THREE.Vector3()).y || 1.8;
  cam.dist = height * 2.4;
  scene.add(char);
  loco = new Locomotion(gltf);
  currentId = id;
  held = null;
  if ($("#prop").value) await holdProp($("#prop").value);
  drawRates();
  $("#ratemsg").textContent = "";
  $("#msg").hidden = true;
  history.replaceState(null, "", "/play?id=" + encodeURIComponent(id));
}

// clip speed sliders: tempo relative to the captured clip; strafes share one slider (they are mirrors)
const RATE_ROWS = [["Walk", ["Walk"]], ["Run", ["Run"]], ["Back", ["WalkBackward"]], ["Strafe", ["StrafeLeft", "StrafeRight"]], ["Idle", ["Idle"]]];
let currentId = null;
function drawRates() {
  const box = $("#rates"); box.innerHTML = "";
  for (const [label, names] of RATE_ROWS) {
    if (!loco || !loco.clips[names[0]]) continue;
    const r = loco.rate(names[0]);
    const inp = Object.assign(document.createElement("input"), { type: "range", min: 0.5, max: 3, step: 0.05, value: r });
    const val = document.createElement("span"); val.className = "mono";
    const show = () => {
      const c = loco.clips[names[0]];
      val.textContent = `${(+inp.value).toFixed(2)}×` + (c.speed ? ` ${(c.speed * c.live).toFixed(2)} m/s` : "");
    };
    inp.oninput = () => { for (const n of names) loco.setRate(n, +inp.value); show(); $("#ratemsg").textContent = "unsaved"; };
    const name = document.createElement("span"); name.textContent = label;
    box.append(name, inp, val); show();
  }
}
$("#resetrates").onclick = () => { if (!loco) return; for (const [, names] of RATE_ROWS) for (const n of names) loco.setRate(n, 1); drawRates(); $("#ratemsg").textContent = "unsaved"; };
$("#saverates").onclick = async () => {
  if (!loco || !currentId) return;
  const body = {};
  for (const [, names] of RATE_ROWS) for (const n of names) if (loco.clips[n]) body[n] = +loco.rate(n).toFixed(3);
  $("#saverates").disabled = true; $("#ratemsg").textContent = "saving…";
  await fetch("/api/clip_rates", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const r = await fetch(`/api/3d/${currentId}/rig`, { method: "POST" });
  if (!r.ok) { $("#ratemsg").textContent = (await r.json()).detail || "re-rig failed"; $("#saverates").disabled = false; return; }
  $("#ratemsg").textContent = "re-rigging…";
  let state;
  for (;;) {
    await new Promise(res => setTimeout(res, 1000));
    const j = await (await fetch("/api/3d/" + currentId)).json();
    if (j.rig?.state === "running") continue;
    state = j.rig;
    break;
  }
  $("#saverates").disabled = false;
  if (state?.state !== "done") { $("#ratemsg").textContent = "re-rig failed: " + (state?.detail || ""); return; }
  const keep = { pos: char?.position.clone(), yaw: yaw.body };
  await load(currentId, true);
  if (keep.pos) { char.position.copy(keep.pos); yaw.body = keep.yaw; }
  $("#ratemsg").textContent = "saved · default for new rigs";
};

// held props (prop.glb + grip.json from the Prop Editor), attached with static/props.js like a game would
let held = null, heldHold = "upright", heldGrip = null;
async function holdProp(id) {
  if (held) { detachProp(held); held = null; }
  if (!id || !char) return;
  const j = await (await fetch("/api/3d/" + id)).json();
  const grip = await (await fetch(`/media/3d/${id}/grip.json?v=${Date.now()}`)).json();
  const prop = (await new GLTFLoader().loadAsync(`/media/3d/${id}/prop.glb?v=${Date.now()}`)).scene;
  prop.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  held = attachProp(char, prop, { hand: grip.hand === "left" ? "Left" : "Right" });
  heldHold = grip.hold; heldGrip = grip;
}
$("#prop").onchange = () => holdProp($("#prop").value);

// input
const keys = new Set();
let mode = "strafe";
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  keys.add(e.code);
  if (e.code === "KeyT") {
    mode = mode === "strafe" ? "free" : "strafe";
    $("#mode").textContent = mode;
    $("#modehint").textContent = mode === "strafe" ? "(faces the camera — S walks back, A/D strafe)" : "(turns toward where it walks)";
  }
});
addEventListener("keyup", e => keys.delete(e.code));
addEventListener("blur", () => keys.clear());
let drag = null;
renderer.domElement.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener("pointermove", e => {
  if (!drag) return;
  yaw.cam -= (e.clientX - drag.x) * 0.006;
  cam.pitch = THREE.MathUtils.clamp(cam.pitch + (e.clientY - drag.y) * 0.004, -0.2, 1.2);
  drag = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener("pointerup", () => drag = null);
renderer.domElement.addEventListener("wheel", e => { cam.dist = THREE.MathUtils.clamp(cam.dist * Math.exp(e.deltaY * 0.001), height * 0.8, height * 8); e.preventDefault(); }, { passive: false });

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
const angleTo = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  if (char && loco) {
    // camera-relative input: +z forward (away from camera), +x to the camera's left
    let ix = (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0) - (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0);
    let iz = (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0) - (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0);
    const run = keys.has("ShiftLeft") || keys.has("ShiftRight");
    let input;
    if (mode === "strafe") {
      // body faces the camera's heading; input stays local
      if (ix || iz) yaw.body += angleTo(yaw.body, yaw.cam) * (1 - Math.exp(-10 * dt));
      const d = angleTo(yaw.body, yaw.cam), c = Math.cos(d), s = Math.sin(d);
      input = { x: ix * c + iz * s, z: iz * c - ix * s };      // camera frame -> body frame (yaw by cam - body)
    } else {
      // body turns toward the input direction and always walks forward
      if (ix || iz) {
        const want = yaw.cam + Math.atan2(ix, iz);
        yaw.body += angleTo(yaw.body, want) * (1 - Math.exp(-8 * dt));
      }
      input = { x: 0, z: ix || iz ? 1 : 0 };
    }
    const v = loco.update(dt, input, run);
    if (held) {   // the saved hold: static carry pose (or the ready pose for two hands), support hand, fingers
      if (heldGrip.arms === "static" && heldGrip.carry) carryPose(char, held, heldGrip.carry, height);
      else if (held.secondary) readyPose(char, held, heldHold);
      if (held.secondary) solveSupportHand(char, held);
      setFingers(char, held.hand, heldGrip.fingers?.primary);
      if (held.secondary) setFingers(char, held.other, heldGrip.fingers?.secondary);
    }
    // local (x left, z forward) -> world, the body faces +Z rotated by yaw.body
    const c = Math.cos(yaw.body), s = Math.sin(yaw.body);
    char.position.x += (v.z * s + v.x * c) * dt;
    char.position.z += (v.z * c - v.x * s) * dt;
    char.rotation.y = yaw.body;
    // camera behind the character
    const t = char.position.clone().add(new THREE.Vector3(0, height * 0.62, 0));
    camera.position.set(t.x - Math.sin(yaw.cam) * Math.cos(cam.pitch) * cam.dist, t.y + Math.sin(cam.pitch) * cam.dist,
                        t.z - Math.cos(yaw.cam) * Math.cos(cam.pitch) * cam.dist);
    camera.lookAt(t);
    sun.position.copy(char.position).add(new THREE.Vector3(4, 8, 3)); sun.target.position.copy(char.position);
    const bars = $("#bars"); bars.innerHTML = "";
    for (const [k, w] of Object.entries(loco.weights)) {
      bars.insertAdjacentHTML("beforeend", `<span>${k}</span><span class="bar"><i style="width:${(w * 100).toFixed(0)}%"></i></span><span>${w.toFixed(2)}</span>`);
    }
    $("#speed").textContent = `${v.speed.toFixed(2)} m/s · phase ${loco.phase.toFixed(2)}`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

// character list: rigged models
(async () => {
  const jobs = (await (await fetch("/api/3d")).json()).filter(j => j.status === "done" && j.outputs?.rigged);
  if (!jobs.length) { $("#msg").textContent = "No rigged models yet — build one with “Rig + animations” on, or use “Rig + animate” on a model in the 3D tab."; return; }
  for (const j of jobs) {
    const o = document.createElement("option"); o.value = j.id;
    o.textContent = j.title || new Date(j.created * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    $("#pick").append(o);
  }
  const want = new URLSearchParams(location.search).get("id");
  const props_ = (await (await fetch("/api/3d?kind=object")).json()).filter(j => j.outputs?.prop);
  for (const j of props_) $("#prop").append(new Option((j.title || j.config?.describe || j.id).slice(0, 40), j.id));
  const id = jobs.some(j => j.id === want) ? want : jobs[0].id;
  $("#pick").value = id;
  $("#pick").onchange = e => load(e.target.value).catch(err => { $("#msg").hidden = false; $("#msg").textContent = "Couldn't load: " + err.message; });
  load(id).catch(err => { $("#msg").hidden = false; $("#msg").textContent = "Couldn't load: " + err.message; });
})();
</script>
</body>
</html>
